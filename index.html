<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>수익 기록</title>
<meta name="theme-color" content="#F5F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="수익 기록">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  /* Pretendard Variable 서브셋 — 아티팩트는 외부 URL 불가라 woff2를 data URI로 인라인 임베드 */
  @font-face{font-family:"Pretendard Variable";src:url("./fonts/Pretendard-sub.woff2") format("woff2");font-weight:45 920;font-display:swap;}
  /* 라이트(화이트) 모드 고정 — 뷰어 OS 설정·테마 토글과 무관하게 항상 동일 팔레트 */
  :root, :root[data-theme="light"], :root[data-theme="dark"]{
    --bg:#F5F6F8; --surface:#FFFFFF; --text-strong:#191F28; --text-sub:#8B95A1;
    --accent:#12B886; --accent-weak:#E6F7F1; --profit:#F04452; --loss:#3182F6;
    --divider:#EEF1F4;
    --card-shadow:0 1px 2px rgba(23,31,40,.04),0 4px 16px rgba(23,31,40,.06);
    --float-shadow:0 4px 12px rgba(23,31,40,.08),0 12px 32px rgba(23,31,40,.12);
    --canvas:#E7E9ED;
    --ease:cubic-bezier(.32,.72,0,1);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;
    -webkit-text-size-adjust:100%;touch-action:manipulation;
    font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    color:var(--text-strong);}
  .rk-stage{
    width:100%;height:100vh;height:100dvh;min-height:-webkit-fill-available;
    background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}

  .phone{
    position:relative;width:100%;flex:1 1 auto;min-height:0;background:var(--bg);
    overflow:hidden;
  }

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);}

  /* dashboard — v2: 타이틀 없음, 헤더는 기간 세그먼트만(h48) */
  .hdr{height:48px;margin-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:0 0 auto;}
  .hdr .ttl{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.02em;}
  .seg-period{display:inline-flex;background:var(--divider);border-radius:999px;padding:3px;}
  .seg-period button{border:0;background:transparent;color:var(--text-sub);font-size:12px;font-weight:600;
    padding:5px 10px;border-radius:999px;cursor:pointer;transition:color .18s var(--ease);}
  .seg-period button[aria-pressed="true"]{background:var(--surface);color:var(--text-strong);box-shadow:var(--card-shadow);}

  .dash-body{flex:1;display:flex;flex-direction:column;padding:0 20px 0;min-height:0;}

  /* 히어로 v2 — 좌: 숫자, 우: 원본 스티커(136×141, 스케일·크롭 금지) */
  .hero{height:172px;flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:12px;padding-top:8px;}
  .hero-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;overflow:hidden;}
  .hero-sticker{flex:0 0 auto;display:block;}
  .hero .cap{font-size:12px;line-height:16px;font-weight:500;color:var(--text-sub);}
  .hero .total{font-size:48px;line-height:56px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;}
  .hero .total.compact{font-size:40px;line-height:48px;}
  .hero .subrow{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:12px;line-height:16px;font-weight:600;}
  .badge.p{background:color-mix(in srgb,var(--profit) 10%,transparent);color:var(--profit);}
  .badge.l{background:color-mix(in srgb,var(--loss) 10%,transparent);color:var(--loss);}
  .badge.z{background:var(--divider);color:var(--text-sub);}
  .hero .cnt{font-size:12px;line-height:16px;color:var(--text-sub);}
  .cnt-btn{display:inline-flex;align-items:center;gap:2px;font-size:12px;line-height:16px;font-weight:500;
    color:var(--text-sub);background:transparent;border:0;cursor:pointer;font-family:inherit;padding:2px 4px;border-radius:6px;}
  .cnt-btn:active{background:var(--divider);}

  .chart-card{flex:1;min-height:340px;margin-top:12px;background:var(--surface);border-radius:20px;box-shadow:var(--card-shadow);
    padding:16px 16px 10px;display:flex;flex-direction:column;position:relative;}
  .chart-head{display:flex;flex-direction:column;gap:2px;min-height:40px;}
  .chart-head .ch-date{font-size:12px;line-height:16px;color:var(--text-sub);font-weight:600;}
  .chart-head .ch-val{font-size:18px;line-height:24px;font-weight:700;letter-spacing:-.02em;}
  .chart-head .ch-sum{font-size:12px;line-height:16px;color:var(--text-sub);}
  .chart-wrap{flex:1;position:relative;min-height:300px;margin-top:12px;touch-action:pan-y;}
  .chart-wrap.scrubbing{touch-action:none;}
  .chart-wrap svg{display:block;width:100%;height:100%;}
  .xlabels{display:flex;justify-content:space-between;padding-top:2px;}
  .xlabels span{font-size:12px;line-height:16px;color:var(--text-sub);}

  .footer-cta{flex:0 0 auto;padding:16px 20px calc(30px + env(safe-area-inset-bottom));}
  .btn-primary{width:100%;height:56px;border:0;border-radius:12px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s var(--ease),filter .12s var(--ease);
    font-family:inherit;}
  .btn-primary:active{transform:scale(.98);filter:brightness(.96);}
  .btn-primary:disabled{background:var(--divider);color:var(--text-sub);cursor:not-allowed;}

  /* input sheet */
  .scrim{position:absolute;inset:0;background:rgba(15,17,21,.35);opacity:0;pointer-events:none;
    transition:opacity .26s var(--ease);z-index:8;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--surface);
    border-radius:28px 28px 0 0;box-shadow:var(--float-shadow);z-index:10;
    padding-top:env(safe-area-inset-top);
    transform:translateY(100%);transition:transform .3s var(--ease);
    display:flex;flex-direction:column;}
  .sheet.show{transform:translateY(0);}
  .grabber{width:36px;height:4px;border-radius:999px;background:var(--divider);margin:8px auto 0;flex:0 0 auto;}
  .sheet-hdr{height:56px;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;}
  .sheet-hdr .title{font-size:20px;line-height:28px;font-weight:700;
    transition:opacity .18s var(--ease),transform .18s var(--ease);}
  .sheet-hdr .title.swap{opacity:0;transform:translateY(4px);}
  .sheet-hdr .close{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;color:var(--text-strong);border-radius:8px;}
  /* pad/cal open → ✕ 대신 ←(단계 뒤로), 부드러운 크로스페이드 */
  .close svg{position:absolute;transition:opacity .18s var(--ease),transform .18s var(--ease);}
  .close .ic-back{opacity:0;transform:translateX(4px) scale(.85);}
  .input-screen.pad-open .close .ic-x,
  .input-screen.cal-open .close .ic-x{opacity:0;transform:rotate(90deg) scale(.85);}
  .input-screen.pad-open .close .ic-back,
  .input-screen.cal-open .close .ic-back{opacity:1;transform:translateX(0) scale(1);}
  .sheet-body{flex:1;display:flex;flex-direction:column;padding:8px 20px 0;min-height:0;overflow:hidden;}

  .field{padding:0;}
  .field-row{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .lbl{font-size:14px;line-height:20px;font-weight:600;color:var(--text-sub);flex:0 0 auto;}
  .field .lbl-top{font-size:14px;line-height:20px;font-weight:600;color:var(--text-sub);display:block;margin-bottom:6px;}
  .val-tap{font-size:16px;font-weight:600;color:var(--text-strong);background:transparent;border:0;cursor:pointer;font-family:inherit;}

  .chiplane{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .chiplane::-webkit-scrollbar{display:none;}
  .chip{height:40px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--divider);
    color:var(--text-sub);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;flex:0 0 auto;font-family:inherit;
    transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease),transform .1s var(--ease);}
  .chip:active{transform:scale(.96);}
  .chip[aria-pressed="true"]{background:var(--text-strong);color:var(--surface);border-color:var(--text-strong);}
  .chip.add{color:var(--accent);border-style:dashed;border-color:var(--accent);}

  .chiplane-wrap{position:relative;}
  .chip-fade{position:absolute;top:0;right:0;bottom:2px;width:40px;pointer-events:none;
    background:linear-gradient(to right,transparent,var(--surface));
    opacity:0;transition:opacity .2s var(--ease);}
  .chip-fade.show{opacity:1;}

  .broker-add{overflow:hidden;height:0;opacity:0;transform:translateY(-4px);display:flex;gap:8px;align-items:center;
    transition:height .24s var(--ease),opacity .24s var(--ease),transform .24s var(--ease);}
  .broker-add.show{height:48px;opacity:1;transform:translateY(0);margin-top:8px;}
  .broker-input{flex:1;height:44px;border:1px solid var(--accent);border-radius:12px;background:var(--bg);
    padding:0 14px;font-size:16px;font-weight:500;color:var(--text-strong);font-family:inherit;outline:none;}
  .broker-input::placeholder{color:var(--text-sub);}
  .broker-add-btn{height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;flex:0 0 auto;}
  .broker-add-btn:disabled{background:var(--divider);color:var(--text-sub);cursor:not-allowed;}
  .broker-cancel{height:44px;padding:0 10px;border:0;border-radius:12px;background:transparent;color:var(--text-sub);
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;flex:0 0 auto;}

  .stock-wrap{position:relative;}
  .stock-input{width:100%;height:56px;border:1px solid var(--divider);border-radius:12px;background:var(--bg);
    padding:0 14px;font-size:16px;font-weight:500;color:var(--text-strong);font-family:inherit;outline:none;
    transition:border-color .16s var(--ease);}
  .stock-input:focus{border-color:var(--accent);}
  .stock-input::placeholder{color:var(--text-sub);}
  .ac{position:absolute;left:0;right:0;top:60px;background:var(--surface);border:1px solid var(--divider);
    border-radius:12px;box-shadow:var(--float-shadow);z-index:5;overflow-y:auto;max-height:172px;display:none;
    -webkit-overflow-scrolling:touch;}
  .ac.show{display:block;}
  .ac button{display:block;width:100%;text-align:left;padding:12px 14px;background:transparent;border:0;
    font-size:16px;color:var(--text-strong);cursor:pointer;font-family:inherit;}
  .ac button:hover,.ac button:focus-visible,.ac button.active{background:var(--bg);outline:none;}
  .ac button:active{background:var(--divider);}
  .ac button mark{background:transparent;color:var(--accent);font-weight:700;}

  .seg-type{display:flex;background:color-mix(in srgb,var(--divider) 70%,transparent);border-radius:12px;padding:4px;height:44px;position:relative;}
  .seg-type .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--surface);
    border-radius:9px;box-shadow:var(--card-shadow);transition:transform .22s var(--ease);z-index:0;}
  .seg-type button{flex:1;border:0;background:transparent;z-index:1;font-size:14px;font-weight:600;color:var(--text-sub);
    cursor:pointer;font-family:inherit;transition:color .18s var(--ease);}
  .seg-type button[aria-pressed="true"]{color:var(--text-strong);}
  .seg-type[data-idx="1"] .ind{transform:translateX(100%);}

  /* 금액 필드 — 행(라벨+값+단위) 전체가 탭 타겟(실제 button), 값+"원" 밀착 우측 정렬 */
  .amt-field{display:block;width:calc(100% + 24px);margin:0 -12px;padding:8px 12px;
    background:transparent;border:0;border-radius:12px;cursor:pointer;font-family:inherit;text-align:left;
    transition:background .1s var(--ease);}
  .amt-field:active{background:var(--divider);}
  .amt{display:block;width:100%;text-align:right;font-size:32px;line-height:40px;font-weight:700;
    letter-spacing:-.02em;color:var(--text-strong);transition:color .2s var(--ease);}
  .amt.amt-sm{font-size:20px;line-height:28px;}
  .amt.zero{color:var(--text-sub);}
  .amt.p{color:var(--profit);} .amt.l{color:var(--loss);}

  .fee-field{overflow:hidden;height:0;opacity:0;transform:translateY(-4px);
    transition:height .24s var(--ease),opacity .24s var(--ease),transform .24s var(--ease);}
  .fee-field.show{height:102px;opacity:1;transform:translateY(0);}
  .fee-note{font-size:12px;line-height:16px;color:var(--text-sub);margin-top:6px;}

  .sheet-footer{flex:0 0 auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom));background:var(--surface);}
  .hint{font-size:12px;line-height:16px;color:var(--text-sub);text-align:center;margin-top:8px;}

  /* pad-open compact focus — sheet becomes [header / context(flex:1) / pad(fixed)] */
  .pad-focus{display:none;flex-direction:column;flex:1;padding:12px 20px 0;min-height:0;}
  .input-screen.pad-open .sheet-body{display:none;}
  .input-screen.pad-open .sheet-footer{display:none;}
  .input-screen.pad-open .pad-focus{display:flex;}
  .pf-summary{font-size:12px;line-height:16px;color:var(--text-sub);margin-bottom:16px;}
  .pf-name{font-size:14px;font-weight:600;color:var(--text-sub);}
  .pf-value{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em;margin-top:8px;color:var(--text-strong);}
  .pf-value.p{color:var(--profit);} .pf-value.l{color:var(--loss);}
  .pf-note{font-size:12px;line-height:16px;color:var(--text-sub);margin-top:8px;min-height:16px;}

  /* calendar-open context — same 3-tier pattern as numpad */
  .cal-focus{display:none;flex-direction:column;flex:1;padding:12px 20px 0;min-height:0;}
  .input-screen.cal-open .sheet-body{display:none;}
  .input-screen.cal-open .sheet-footer{display:none;}
  .input-screen.cal-open .cal-focus{display:flex;}

  /* mini calendar */
  .cal{display:none;flex:0 0 auto;background:var(--surface);border-radius:28px 28px 0 0;
    box-shadow:var(--float-shadow);padding:14px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--divider);}
  .cal.show{display:block;animation:padUp .28s var(--ease);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;}
  .cal-title{font-size:16px;font-weight:700;color:var(--text-strong);}
  .cal-nav{width:36px;height:36px;border:0;background:transparent;border-radius:10px;color:var(--text-strong);
    cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .cal-nav:active{background:var(--divider);}
  .cal-nav:disabled{color:var(--divider);cursor:not-allowed;}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:4px;}
  .cal-week span{text-align:center;font-size:12px;line-height:20px;font-weight:600;color:var(--text-sub);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-day{height:40px;border:0;background:transparent;border-radius:10px;font-size:15px;font-weight:600;
    color:var(--text-strong);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;}
  .cal-day:active{background:var(--divider);}
  .cal-day:disabled{color:var(--divider);cursor:not-allowed;}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);}
  .cal-day.sel{background:var(--accent);color:#fff;box-shadow:none;}
  .cal-day.empty{visibility:hidden;}

  /* history screen */
  .history{transform:translateX(100%);transition:transform .3s var(--ease);z-index:6;background:var(--bg);}
  .history.show{transform:translateX(0);}
  .back-btn{width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:var(--text-strong);
    cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .back-btn:active{background:var(--divider);}
  .hist-actions{display:flex;align-items:center;gap:12px;}
  .hist-act{background:transparent;border:0;color:var(--text-sub);font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;padding:4px 2px;border-radius:6px;}
  .hist-act:active{color:var(--text-strong);}
  .hist-clear{display:block;margin:24px auto 8px;background:transparent;border:0;color:var(--text-sub);
    font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:8px 12px;border-radius:8px;}
  .hist-clear:active{background:var(--divider);}
  .hist-body{flex:1;overflow-y:auto;padding:0 20px calc(28px + env(safe-area-inset-bottom));min-height:0;-webkit-overflow-scrolling:touch;}
  .hist-group{font-size:12px;line-height:16px;font-weight:600;color:var(--text-sub);margin:18px 0 4px;}
  .hist-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;
    padding:8px 0;background:transparent;border:0;border-bottom:1px solid var(--divider);cursor:pointer;
    font-family:inherit;text-align:left;}
  .hist-item:active{background:var(--divider);}
  .hist-l{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .hist-stock{font-size:16px;line-height:24px;font-weight:500;color:var(--text-strong);display:flex;align-items:center;gap:6px;}
  .hist-meta{font-size:12px;line-height:16px;color:var(--text-sub);}
  .mini-badge{display:inline-flex;padding:1px 6px;border-radius:6px;font-size:11px;line-height:15px;font-weight:600;
    background:var(--accent-weak);color:var(--accent);flex:0 0 auto;}
  .hist-net{font-size:16px;font-weight:700;flex:0 0 auto;}
  .hist-net.p{color:var(--profit);} .hist-net.l{color:var(--loss);} .hist-net.z{color:var(--text-sub);}
  .hist-empty{text-align:center;color:var(--text-sub);font-size:14px;padding:48px 0;}

  /* delete confirm */
  .confirm{position:absolute;inset:0;background:rgba(15,17,21,.4);z-index:45;display:none;
    align-items:center;justify-content:center;padding:0 32px;}
  .confirm.show{display:flex;}
  .confirm-card{width:100%;background:var(--surface);border-radius:20px;padding:24px 20px 16px;box-shadow:var(--float-shadow);}
  .confirm-t{font-size:18px;line-height:26px;font-weight:700;color:var(--text-strong);text-align:center;}
  .confirm-sub{font-size:13px;line-height:18px;color:var(--text-sub);text-align:center;margin-top:8px;}
  .confirm-btns{display:flex;gap:8px;margin-top:20px;}
  .cbtn{flex:1;height:48px;border:0;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:transform .12s var(--ease);}
  .cbtn:active{transform:scale(.97);}
  .cbtn.ghost{background:var(--divider);color:var(--text-strong);}
  .cbtn.del{background:var(--text-strong);color:var(--surface);}

  /* numpad — flex-flow child at sheet bottom (never overlaps footer) */
  .pad{display:none;flex:0 0 auto;background:var(--surface);border-radius:28px 28px 0 0;
    box-shadow:var(--float-shadow);padding:14px 12px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--divider);}
  .pad.show{display:block;animation:padUp .28s var(--ease);}
  @keyframes padUp{from{transform:translateY(24px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .pad-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px;}
  .pad-head .n{font-size:14px;font-weight:600;color:var(--text-sub);}
  .pad-head-r{display:flex;align-items:center;gap:12px;}
  .pad-head .v{font-size:20px;line-height:28px;font-weight:700;color:var(--text-strong);}
  .pad-head .v.p{color:var(--profit);} .pad-head .v.l{color:var(--loss);}
  .pad-done{border:0;background:transparent;color:var(--accent);font-size:16px;font-weight:700;
    cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:8px;}
  .pad-done:active{background:var(--accent-weak);}
  .pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .key{height:56px;border:0;background:transparent;border-radius:12px;font-size:20px;font-weight:700;
    color:var(--text-strong);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;
    transition:background .1s var(--ease);}
  .key:active{background:var(--divider);}
  .key.sign{font-size:22px;color:var(--accent);}

  /* toast — 좌측 4px 세로 스트라이프(부호별 색), 이모지가 아이콘 역할 */
  .toast{position:absolute;left:16px;right:16px;bottom:calc(110px + env(safe-area-inset-bottom));background:var(--text-strong);color:var(--surface);
    border-radius:14px;padding:14px 16px;font-size:14px;font-weight:600;z-index:40;box-shadow:var(--float-shadow);
    pointer-events:none;
    transform:translateY(20px);opacity:0;transition:transform .3s var(--ease),opacity .3s var(--ease);
    display:flex;align-items:stretch;gap:10px;}
  .toast.show{transform:translateY(0);opacity:1;}
  .t-stripe{width:4px;border-radius:2px;flex:0 0 auto;}
  .t-stripe.p{background:var(--profit);} .t-stripe.l{background:var(--loss);} .t-stripe.z{background:var(--text-sub);}
  .t-msg{flex:1;text-align:center;align-self:center;}

  .lastdot{transition:none;}
  @keyframes pop{0%{transform:scale(0);}60%{transform:scale(1.25);}100%{transform:scale(1);}}
  .lastdot.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--ease);}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms !important;animation-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div class="rk-stage">
  <div class="phone" id="phone">

    <!-- DASHBOARD -->
    <section class="screen" id="dashboard" aria-label="대시보드">
      <div class="hdr">
        <span></span>
        <div class="seg-period" role="group" aria-label="기간">
          <button data-period="month" aria-pressed="true">이번 달</button>
          <button data-period="year" aria-pressed="false">올해</button>
          <button data-period="all" aria-pressed="false">전체</button>
        </div>
      </div>

      <div class="dash-body">
        <div class="hero">
          <div class="hero-l">
            <div class="cap">누적 실현손익</div>
            <div class="total num" id="heroTotal">0원</div>
            <div class="subrow">
              <span class="badge p" id="heroBadge">이번 달 +0</span>
              <button class="cnt-btn num" id="heroCount" aria-label="기록 내역 보기"><span id="heroCountTxt">· 0건</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
          </div>
          <img class="hero-sticker" id="heroSticker" width="136" height="141" alt="놀고 먹게 해듀세요 — 마스코트 스티커" />
        </div>

        <div class="chart-card">
          <div class="chart-head" id="chartHead">
            <div class="ch-sum" id="chSummary">최고 +0 · 최저 +0</div>
            <div class="ch-date num" id="chDate" style="display:none"></div>
            <div class="ch-val num" id="chVal" style="display:none"></div>
          </div>
          <div class="chart-wrap" id="chartWrap">
            <svg id="chartSvg" preserveAspectRatio="none" aria-label="누적 손익 추이 그래프"></svg>
          </div>
          <div class="xlabels num" id="xLabels"></div>
        </div>
      </div>

      <div class="footer-cta">
        <button class="btn-primary" id="openSheet">+ 손익 기록하기</button>
      </div>
    </section>

    <!-- SCRIM + INPUT SHEET -->
    <div class="scrim" id="scrim"></div>
    <section class="screen input-screen" id="inputScreen" style="position:absolute;inset:0;pointer-events:none;background:transparent;">
      <div class="sheet" id="sheet" aria-label="손익 기록하기" style="pointer-events:auto;">
        <div class="grabber"></div>
        <div class="sheet-hdr">
          <button class="close" id="closeSheet" aria-label="닫기">
            <svg class="ic-x" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            <svg class="ic-back" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <div class="title" id="sheetTitle" aria-live="polite">손익 기록하기</div>
        </div>

        <div class="sheet-body" id="sheetBody">
          <div class="field field-row">
            <span class="lbl">날짜</span>
            <button class="val-tap num" id="dateBtn">오늘 7/8 (화)</button>
          </div>

          <div class="field">
            <span class="lbl-top">증권사</span>
            <div class="chiplane-wrap">
              <div class="chiplane" id="chipLane"></div>
              <div class="chip-fade" id="chipFade" aria-hidden="true"></div>
            </div>
            <div class="broker-add" id="brokerAdd">
              <input class="broker-input" id="brokerInput" type="text" placeholder="증권사명 입력" autocomplete="off" maxlength="12" aria-label="증권사명 입력" />
              <button class="broker-add-btn" id="brokerAddBtn" disabled>추가</button>
              <button class="broker-cancel" id="brokerCancel" aria-label="취소">취소</button>
            </div>
          </div>

          <div class="field" style="margin-top:16px;">
            <span class="lbl-top">종목</span>
            <div class="stock-wrap">
              <input class="stock-input" id="stockInput" type="text" placeholder="예: 삼성전자" autocomplete="off" />
              <div class="ac" id="autocomplete"></div>
            </div>
          </div>

          <div class="field" style="margin-top:16px;">
            <span class="lbl-top">유형</span>
            <div class="seg-type" id="segType" data-idx="0" role="group" aria-label="유형">
              <span class="ind"></span>
              <button data-type="일반" aria-pressed="true">일반</button>
              <button data-type="청약" aria-pressed="false">청약</button>
            </div>
          </div>

          <div class="field" style="margin-top:10px;">
            <button class="amt-field" id="pnlBtn" aria-label="손익 입력 — 숫자패드 열기">
              <span class="lbl-top">손익 (증권사 표시 금액)</span>
              <span class="amt num zero" id="pnlValue">0원</span>
            </button>
          </div>

          <div class="fee-field" id="feeField">
            <div style="padding-top:10px;">
              <button class="amt-field" id="feeBtn" aria-label="청약수수료 입력 — 숫자패드 열기">
                <span class="lbl-top">청약수수료</span>
                <span class="amt amt-sm num" id="feeValue">2,000원</span>
              </button>
              <div class="fee-note num" id="feeNote">수수료 제외 ±0원으로 기록돼요</div>
            </div>
          </div>
        </div>

        <!-- pad-open compact focus view -->
        <div class="pad-focus" id="padFocus">
          <div class="pf-summary num" id="pfSummary">7/8 · 신한 · 종목 미입력 · 일반</div>
          <div class="pf-name" id="pfName">손익 (증권사 표시 금액)</div>
          <div class="pf-value num" id="pfValue">0</div>
          <div class="pf-note num" id="pfNote"></div>
        </div>

        <!-- calendar-open context view -->
        <div class="cal-focus" id="calFocus">
          <div class="pf-name">날짜</div>
          <div class="pf-value num" id="calFocusValue">오늘 7/8 (화)</div>
        </div>

        <div class="sheet-footer">
          <button class="btn-primary" id="saveBtn" disabled>기록 완료</button>
          <div class="hint" id="saveHint">종목과 손익을 입력해 주세요</div>
        </div>

        <!-- numpad -->
        <div class="pad" id="pad" role="group" aria-label="숫자패드">
          <div class="pad-head">
            <span class="n" id="padName">손익</span>
            <div class="pad-head-r">
              <span class="v num" id="padPreview">0</span>
              <button class="pad-done" id="padDone">완료</button>
            </div>
          </div>
          <div class="pad-grid" id="padGrid"></div>
        </div>

        <!-- mini calendar (bottom pattern, same as numpad) -->
        <div class="cal" id="cal" role="group" aria-label="날짜 선택">
          <div class="cal-head">
            <button class="cal-nav" id="calPrev" aria-label="이전 달">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <span class="cal-title num" id="calTitle">2026년 7월</span>
            <button class="cal-nav" id="calNext" aria-label="다음 달">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <div class="cal-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div class="cal-grid num" id="calGrid"></div>
        </div>
      </div>
    </section>

    <!-- HISTORY LIST (scrollable) -->
    <section class="screen history" id="historyScreen" aria-label="기록 내역">
      <div class="hdr">
        <button class="back-btn" id="histBack" aria-label="뒤로가기">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="ttl">기록 내역</div>
        <div class="hist-actions">
          <button class="hist-act" id="btnExport">내보내기</button>
          <button class="hist-act" id="btnImport">가져오기</button>
        </div>
      </div>
      <input type="file" id="fileImport" accept=".csv" hidden />
      <div class="hist-body" id="histBody"></div>
    </section>

    <!-- delete confirm -->
    <div class="confirm" id="confirm" role="dialog" aria-modal="true" aria-label="기록 삭제 확인">
      <div class="confirm-card">
        <div class="confirm-t" id="confirmTitle">이 기록을 지울까요?</div>
        <div class="confirm-sub num" id="confirmSub"></div>
        <div class="confirm-btns">
          <button class="cbtn ghost" id="confirmNo">그대로 둘게요</button>
          <button class="cbtn del" id="confirmYes">지우기</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

  $("heroSticker").src=MASCOT_URI; // 히어로 우측 — 원본 136×141 그대로 (스케일·크롭 없음)

  // ---------- format ----------
  function comma(n){ return Math.abs(n).toLocaleString("en-US"); }
  function signedWon(n){ var s = n>0?"+":(n<0?"−":"±"); return s+comma(n)+"원"; }
  function signed(n){ var s = n>0?"+":(n<0?"−":"±"); return s+comma(n); }

  // ---------- seed data ----------
  // realPnl = pnl - (type==='청약' ? fee : 0)
  var entries = [];
  function real(e){ return e.pnl - (e.type==="청약"? e.fee : 0); }
  var _id=0; function genId(){ return ++_id; }
  entries.forEach(function(e){ e.id=genId(); e.createdAt=new Date().toISOString(); }); // 향후 클라우드 동기화 대비

  var TODAY = new Date(); TODAY.setHours(0,0,0,0);
  function _iso(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  var TODAY_STR = _iso(TODAY);
  function parseD(s){ return new Date(s+"T00:00:00"); }
  function monthKey(s){ return s.slice(0,7); }

  var state = { period:"month" };

  // ---------- period filter ----------
  function filtered(){
    if(state.period==="all") return entries.slice();
    if(state.period==="year") return entries.filter(function(e){return e.d.slice(0,4)===TODAY_STR.slice(0,4);});
    return entries.filter(function(e){return monthKey(e.d)===monthKey(TODAY_STR);});
  }

  // ---------- cumulative points ----------
  function cumPoints(list){
    var sorted = list.slice().sort(function(a,b){return parseD(a.d)-parseD(b.d);});
    var run=0, pts=[];
    for(var i=0;i<sorted.length;i++){ run+=real(sorted[i]); pts.push({date:sorted[i].d, cum:run, e:sorted[i]}); }
    return pts;
  }

  // ---------- totals (지표 row 삭제 — 합계·건수만 사용) ----------
  function computeMetrics(list){
    var total=0, cnt=list.length;
    for(var i=0;i<list.length;i++){ total+=real(list[i]); }
    return {total:total, cnt:cnt};
  }

  // ---------- count-up ----------
  function countUp(el, target){
    if(reduce){ el.textContent = signedWon(target); el.style.color = colorFor(target); return; }
    var start=performance.now(), dur=700;
    function frame(now){
      var t=Math.min(1,(now-start)/dur);
      var e=1-Math.pow(2,-10*t); // easeOutExpo
      var v=Math.round(target*e);
      el.textContent = signedWon(v);
      el.style.color = colorFor(v);
      if(t<1) requestAnimationFrame(frame);
      else { el.textContent=signedWon(target); el.style.color=colorFor(target); }
    }
    requestAnimationFrame(frame);
  }
  function colorFor(v){ return v>0? "var(--profit)" : (v<0? "var(--loss)" : "var(--text-sub)"); }

  // ---------- chart ----------
  var chartData=null;
  function renderChart(list){

      var NS="http://www.w3.org/2000/svg", XL="http://www.w3.org/1999/xlink";

    var final=pts[pts.length-1].cum;

    var xy=pts.map(function(p){return {x:X(p.date), y:Y(p.cum), p:p};});

    var dArea=dLine+" L "+xy[xy.length-1].x+" "+zeroY+" L "+xy[0].x+" "+zeroY+" Z";

  }

  // ---------- scrub ----------
  function nearestIdx(px){

  function bindScrub(){
    var wrap=$("chartWrap");
    var scrubbing=false, revertT=null;
    function pos(ev){
      var r=$("chartSvg").getBoundingClientRect();
      var cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
      var scaleX=chartData.W/r.width;
      return cx*scaleX;
    }
    function down(ev){
      if(!chartData)return;
      scrubbing=true; wrap.classList.add("scrubbing");
      if(revertT){clearTimeout(revertT);revertT=null;}
      showScrub(nearestIdx(pos(ev)));
      ev.preventDefault();
    }
    function move(ev){ if(!scrubbing||!chartData)return; showScrub(nearestIdx(pos(ev))); ev.preventDefault(); }
    function up(){
      if(!scrubbing)return; scrubbing=false; wrap.classList.remove("scrubbing");
      revertT=setTimeout(hideScrub, reduce?0:250);
    }
    wrap.addEventListener("mousedown",down);
    window.addEventListener("mousemove",move);
    window.addEventListener("mouseup",up);
    wrap.addEventListener("touchstart",down,{passive:false});
    wrap.addEventListener("touchmove",move,{passive:false});
    wrap.addEventListener("touchend",up);
  }

    closeSheet();
    // reset draft
    draft.stock=""; stockInput.value=""; draft.pnl={digits:"",sign:1}; draft.type="일반";
    draft.date=TODAY_STR; $("dateBtn").textContent=dateLabel(TODAY_STR);
    segType.dataset.idx=0; segType.querySelectorAll("button").forEach(function(b,i){b.setAttribute("aria-pressed",i===0?"true":"false");});
    $("feeField").classList.remove("show"); draft.fee={digits:"2000"};
    updateFieldValues(); updatePreview();

    setTimeout(function(){
      renderDashboard(true);
      showToast(r);
      var dot=$("lastDot");
      if(dot && !reduce){ dot.classList.remove("pop"); void dot.getBoundingClientRect(); dot.classList.add("pop"); }
    }, 320);
  });

  // ---------- info toast (중립 스트라이프) ----------
  function showInfoToast(msg){
    var t=$("toast");
    t.innerHTML='<span class="t-stripe z" aria-hidden="true"></span><span class="t-msg"></span>';
    t.querySelector(".t-msg").textContent=msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  // ---------- CSV 백업(내보내기) / 복원(가져오기) — 외부 라이브러리 없음 ----------
  function csvEscape(v){ v=(v==null?"":String(v)); if(/[",\n\r]/.test(v)){ v='"'+v.replace(/"/g,'""')+'"'; } return v; }
  function parseCsvLine(line){
    var out=[], cur="", q=false;
    for(var i=0;i<line.length;i++){ var ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===",") { out.push(cur); cur=""; } else cur+=ch; }
    }
    out.push(cur); return out;
  }
  function exportCSV(){
    var header=["일자","증권사","종목","유형","손익","청약수수료","진짜손익"];
    var rows=[header];
    entries.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;}).forEach(function(e){
      rows.push([e.d,e.broker,e.stock,e.type,e.pnl,(e.type==="청약"?e.fee:0),real(e)]);
    });
    var csv=rows.map(function(r){return r.map(csvEscape).join(",");}).join("\r\n");
    var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"}); // UTF-8 BOM으로 엑셀 한글 보존
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download="수익기록_"+TODAY_STR+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function importCSV(text){
    text=String(text).replace(/^﻿/,""); // BOM 제거
    var lines=text.split(/\r\n|\n|\r/).filter(function(l){return l.trim()!=="";});
    if(lines.length<2) return {ok:false};
    var added=0;
    for(var i=1;i<lines.length;i++){ // 헤더 행 스킵
      var c=parseCsvLine(lines[i]);
      if(c.length<5) continue;
      var d=(c[0]||"").trim(), broker=(c[1]||"").trim(), stock=(c[2]||"").trim(), type=(c[3]||"").trim();
      var pnl=parseInt(String(c[4]).replace(/[^0-9\-]/g,""),10);
      var fee=c[5]!=null?parseInt(String(c[5]).replace(/[^0-9\-]/g,""),10):0;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || !stock || isNaN(pnl)) continue;
      if(type!=="청약") type="일반";
      var dup=entries.some(function(e){return e.d===d && e.broker===broker && e.stock===stock && e.pnl===pnl;});
      if(dup) continue; // (일자+증권사+종목+손익) 동일 건 중복 추가 안 함
      entries.push({ id:genId(), createdAt:new Date().toISOString(), d:d, broker:broker, type:type,
                     stock:stock, pnl:pnl, fee:(type==="청약"?(isNaN(fee)?0:fee):0) });
      if(broker && brokers.indexOf(broker)<0) brokers.push(broker);
      addStockCandidate(stock);
      added++;
    }
    return {ok:true, added:added};
  }
  $("btnExport").addEventListener("click",exportCSV);
  $("btnImport").addEventListener("click",function(){ $("fileImport").click(); });
  $("fileImport").addEventListener("change",function(ev){
    var f=ev.target.files && ev.target.files[0];
    if(!f){ return; }
    var rd=new FileReader();
    rd.onload=function(){
      var res; try{ res=importCSV(rd.result); }catch(e){ res={ok:false}; }
      if(!res.ok){ showInfoToast("파일 형식을 확인해 주세요"); }
      else { persist(); renderChips(); renderHistory(); renderDashboard(false); showInfoToast(res.added+"건 가져왔어요"); }
      $("fileImport").value="";
    };
    rd.onerror=function(){ showInfoToast("파일 형식을 확인해 주세요"); $("fileImport").value=""; };
    rd.readAsText(f,"utf-8");
  });

  // ---------- history list ----------
  var pendingDeleteId=null, confirmMode="delete";
  function groupLabel(isoStr){
    var dt=parseD(isoStr);
    return (dt.getMonth()+1)+"월 "+dt.getDate()+"일 "+DAYS[dt.getDay()]+"요일";
  }
  function renderHistory(){
    var body=$("histBody"); body.innerHTML="";
    if(entries.length===0){
      var em=document.createElement("div"); em.className="hist-empty";
      em.textContent="아직 기록이 없어요";
      body.appendChild(em); return;
    }
    var sorted=entries.slice().sort(function(a,b){
      if(a.d===b.d) return b.id-a.id;
      return a.d<b.d?1:-1; // date desc
    });
    var lastDate=null;
    sorted.forEach(function(e){
      if(e.d!==lastDate){
        lastDate=e.d;
        var g=document.createElement("div"); g.className="hist-group";
        g.textContent=groupLabel(e.d);
        body.appendChild(g);
      }
      var net=real(e);
      var item=document.createElement("button"); item.type="button"; item.className="hist-item";
      item.setAttribute("aria-label",e.stock+" "+signedWon(net)+" 삭제하려면 선택");

      var l=document.createElement("div"); l.className="hist-l";
      var st=document.createElement("div"); st.className="hist-stock";
      st.appendChild(document.createTextNode(e.stock));
      if(e.type==="청약"){
        var mb=document.createElement("span"); mb.className="mini-badge"; mb.textContent="청약";
        st.appendChild(mb);
      }
      var meta=document.createElement("div"); meta.className="hist-meta";
      meta.textContent=e.broker+" · "+e.type;
      l.appendChild(st); l.appendChild(meta);

      var nv=document.createElement("div");
      nv.className="hist-net num "+(net>0?"p":net<0?"l":"z");
      nv.textContent=signedWon(net);

      item.appendChild(l); item.appendChild(nv);
      item.addEventListener("click",function(){
        confirmMode="delete"; pendingDeleteId=e.id;
        $("confirmTitle").textContent="이 기록을 지울까요?";
        $("confirmSub").textContent=groupLabel(e.d)+" · "+e.stock+" · "+signedWon(net);
        $("confirm").classList.add("show");
      });
      body.appendChild(item);
    });
    // 전체 삭제(선택) — 확인 후 localStorage 포함 삭제
    var clr=document.createElement("button"); clr.type="button"; clr.className="hist-clear";
    clr.textContent="전체 삭제";
    clr.addEventListener("click",function(){
      confirmMode="clear"; pendingDeleteId=null;
      $("confirmTitle").textContent="모든 기록을 지울까요?";
      $("confirmSub").textContent="내보내기로 백업해 두는 걸 추천해요";
      $("confirm").classList.add("show");
    });
    body.appendChild(clr);
  }

  function openHistory(){ renderHistory(); $("historyScreen").classList.add("show"); }
  function closeHistory(){ $("historyScreen").classList.remove("show"); }
  $("heroCount").addEventListener("click",openHistory);
  $("histBack").addEventListener("click",closeHistory);

  $("confirmNo").addEventListener("click",function(){
    pendingDeleteId=null; $("confirm").classList.remove("show");
  });
  $("confirmYes").addEventListener("click",function(){
    if(confirmMode==="clear"){
      entries.length=0; persist();
      renderHistory(); renderDashboard(false); vibe(10);
    } else if(pendingDeleteId!=null){
      for(var i=0;i<entries.length;i++){
        if(entries[i].id===pendingDeleteId){ entries.splice(i,1); break; }
      }
      persist();
      renderHistory(); renderDashboard(false); vibe(10);
    }
    pendingDeleteId=null; confirmMode="delete";
    $("confirm").classList.remove("show");
  });
  $("confirm").addEventListener("click",function(ev){
    if(ev.target===$("confirm")){ pendingDeleteId=null; $("confirm").classList.remove("show"); }
  });

  // ---------- init ----------
  function init(){
    $("dateBtn").textContent=dateLabel(TODAY_STR);
    updateFieldValues(); updatePreview();
    renderDashboard(true);
    bindScrub();
  }
  // 서비스워커 등록 (GitHub Pages 상대경로)
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
  }
  // wait a tick so layout is measured
  requestAnimationFrame(function(){ requestAnimationFrame(init); });
  window.addEventListener("resize",function(){ renderDashboard(false); });
})();
</script>
